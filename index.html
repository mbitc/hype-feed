<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hype Feed // Pure P2P Stream</title>
  
  <!-- CDN Bibliotekos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #09090b;
      color: #ffffff;
    }

    .feed-viewport {
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .feed-card {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: normal;
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="select-none font-sans">

  <!-- TOP BAR -->
  <header class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent backdrop-blur-xs pointer-events-none">
    <div class="flex items-center gap-2 pointer-events-auto">
      <span class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></span>
      <h1 class="font-extrabold tracking-wider text-sm bg-gradient-to-r from-orange-400 to-yellow-300 bg-clip-text text-transparent">
        HYPE FEED
      </h1>
    </div>

    <div class="flex items-center gap-3 pointer-events-auto">
      <!-- Balance Display -->
      <button onclick="toggleWalletModal()" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/10 active:scale-95 transition">
        <i data-lucide="zap" class="w-3.5 h-3.5 text-yellow-400 fill-yellow-400"></i>
        <span id="balance-display" class="text-xs font-mono font-bold text-yellow-300">5.00 €</span>
      </button>

      <!-- Identity Preview -->
      <div class="text-[10px] font-mono text-zinc-400 px-2 py-1 rounded bg-black/40 border border-white/5">
        <span id="pubkey-preview">...</span>
      </div>
    </div>
  </header>

  <!-- FEED CONTAINER -->
  <main id="feed-container" class="feed-viewport w-full">
    <div id="empty-state" class="h-full w-full flex flex-col items-center justify-center p-6 text-center">
      <i data-lucide="radio" class="w-12 h-12 text-orange-500 animate-pulse mb-3"></i>
      <p class="text-zinc-400 text-sm">Ieškoma gyvų P2P postų tinkle...</p>
      <p class="text-zinc-600 text-xs mt-1">Būk pirmas ir įkelk nuotrauką paspaudęs „+“</p>
    </div>
  </main>

  <!-- UPLOAD MODAL (z-[100] Užtikrina, kad mygtukai neatidurs viršuje) -->
  <div id="upload-modal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md hidden flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold text-orange-400">Naujas P2P Įrašas</h2>
      <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white p-2">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <div class="my-auto flex flex-col items-center gap-4 w-full max-w-md mx-auto">
      <div class="w-full max-h-[50vh] rounded-xl overflow-hidden bg-zinc-900 border border-white/10 flex items-center justify-center p-2">
        <img id="upload-preview" src="" alt="Preview" class="max-h-[45vh] w-auto object-contain rounded-lg" />
      </div>
      <input type="text" id="upload-caption" placeholder="Įrašyk aprašymą / hashtag..." class="w-full px-4 py-3 rounded-lg bg-zinc-900 border border-white/10 text-sm text-white focus:outline-none focus:border-orange-500" />
    </div>

    <button id="publish-btn" onclick="publishPost()" class="w-full max-w-md mx-auto py-3.5 rounded-full bg-gradient-to-r from-orange-500 to-yellow-400 font-bold text-black active:scale-95 transition flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20">
      <i data-lucide="send" class="w-5 h-5"></i>
      <span>Ištransliuoti į P2P tinklą</span>
    </button>
  </div>

  <!-- FLOATING ACTION BUTTON (UPLOAD) -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30">
    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
    <button onclick="triggerUpload()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-400 p-0.5 shadow-xl shadow-orange-500/20 active:scale-90 transition">
      <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center">
        <i data-lucide="plus" class="w-7 h-7 text-orange-400"></i>
      </div>
    </button>
  </div>

  <script>
    // Patikimesni relėjai survive WebSocket handshake
    const RELAYS = [
      'wss://nos.lol',
      'wss://relay.nostr.band',
      'wss://purplerelay.com'
    ];

    let userKeys = { pk: '', pub: '' };
    let loadedPostIds = new Set();
    let selectedFile = null;
    let openSockets = [];
    let previewDataUrl = '';

    function initIdentity() {
      let savedPk = localStorage.getItem('hype_priv_key');
      if (!savedPk) {
        if (window.NostrTools && typeof NostrTools.generatePrivateKey === 'function') {
          savedPk = NostrTools.generatePrivateKey();
        } else {
          savedPk = Array.from(crypto.getRandomValues(new Uint8Array(32)))
            .map(b => b.toString(16).padStart(2, '0')).join('');
        }
        localStorage.setItem('hype_priv_key', savedPk);
      }
      userKeys.pk = savedPk;

      try {
        if (window.NostrTools && typeof NostrTools.getPublicKey === 'function') {
          userKeys.pub = NostrTools.getPublicKey(savedPk);
        } else {
          userKeys.pub = savedPk.substring(0, 8);
        }
      } catch (e) {
        userKeys.pub = savedPk.substring(0, 8);
      }

      const pubEl = document.getElementById('pubkey-preview');
      if (pubEl) pubEl.innerText = userKeys.pub.substring(0, 6) + '...';
    }

    function createCardDOM(id, pubkey, mediaUrl, text, isPrepend = false) {
      if (loadedPostIds.has(id)) return;
      loadedPostIds.add(id);

      const emptyState = document.getElementById('empty-state');
      if (emptyState) emptyState.remove();

      const container = document.getElementById('feed-container');
      const card = document.createElement('section');
      card.className = 'feed-card flex items-center justify-center bg-zinc-950 overflow-hidden';
      card.id = id;

      const initialTips = localStorage.getItem(`post_tips_${id}`) || '0.00';
      const shortPubkey = pubkey ? pubkey.substring(0, 8) : 'anon';

      card.innerHTML = `
        <img src="${mediaUrl}" 
             alt="Stream Visual" 
             class="w-full h-full object-cover" 
             loading="lazy"
             onerror="this.parentElement.remove()" />
        
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 pointer-events-none"></div>

        <!-- Šoniniai valdikliai -->
        <div class="absolute right-4 bottom-28 flex flex-col gap-6 items-center z-20">
          <button onclick="handleTip('${id}', '0.10')" class="group relative flex flex-col items-center">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-600 to-yellow-500 p-0.5 shadow-lg shadow-orange-500/30 active:scale-95 transition">
              <div class="w-full h-full bg-black/50 rounded-full flex items-center justify-center backdrop-blur-sm">
                <i data-lucide="flame" class="w-7 h-7 text-orange-400 fill-orange-400"></i>
              </div>
            </div>
            <span id="tip-count-${id}" class="text-[11px] font-bold mt-1 text-orange-400 font-mono">
              ${parseFloat(initialTips).toFixed(2)} €
            </span>
          </button>

          <button onclick="sharePost('${id}')" class="flex flex-col items-center group">
            <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center active:scale-95 transition">
              <i data-lucide="share-2" class="w-5 h-5 text-zinc-300"></i>
            </div>
            <span class="text-[10px] text-zinc-400 mt-1">Dalintis</span>
          </button>
        </div>

        <!-- Aprašymas -->
        <div class="absolute left-4 bottom-24 right-20 z-20">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-md border border-orange-500/30 font-mono">
              @${shortPubkey}
            </span>
          </div>
          <p class="text-sm text-zinc-200 line-clamp-2 drop-shadow">${text || ''}</p>
        </div>
      `;

      if (isPrepend && container.firstChild) {
        container.insertBefore(card, container.firstChild);
        container.scrollTop = 0;
      } else {
        container.appendChild(card);
      }

      if (window.lucide) lucide.createIcons();
    }

    function connectNostrRelays() {
      RELAYS.forEach(url => {
        try {
          const ws = new WebSocket(url);
          ws.onopen = () => {
            openSockets.push(ws);
            ws.send(JSON.stringify(["REQ", "live_feed", { kinds: [1], limit: 30 }]));
          };
          ws.onmessage = (msg) => {
            try {
              const res = JSON.parse(msg.data);
              if (res[0] === "EVENT" && res[2]) {
                const ev = res[2];
                const imgMatch = ev.content.match(/(https?:\/\/[^\s]+?\.(?:png|jpg|jpeg|gif|webp)(?:\?[^\s]*)?|data:image\/[a-zA-Z]+;base64,[^\s]+)/i);
                if (imgMatch) {
                  createCardDOM('nostr-' + ev.id, ev.pubkey, imgMatch[0], ev.content.replace(imgMatch[0], '').trim());
                }
              }
            } catch(e) {}
          };
        } catch(e) {}
      });
    }

    // --- UPLOAD ENGINE WITH CORS FALLBACK ---

    function triggerUpload() {
      document.getElementById('file-input').click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewDataUrl = e.target.result;
        document.getElementById('upload-preview').src = previewDataUrl;
        document.getElementById('upload-modal').classList.remove('hidden');
        document.getElementById('upload-modal').classList.add('flex');
      };
      reader.readAsDataURL(file);
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').classList.add('hidden');
      document.getElementById('upload-modal').classList.remove('flex');
      selectedFile = null;
      document.getElementById('file-input').value = '';
    }

    async function publishPost() {
      if (!selectedFile) return;

      const btn = document.getElementById('publish-btn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>Ištransliuojama...</span>`;
      if (window.lucide) lucide.createIcons();

      let uploadedUrl = '';

      try {
        // Bandome kelti į P2P CDN providerį
        const formData = new FormData();
        formData.append('file[]', selectedFile);

        const response = await fetch('https://nostr.build/api/v2/upload/files', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const data = await response.json();
          if (data && data.data && data.data[0] && data.data[0].url) {
            uploadedUrl = data.data[0].url;
          }
        }
      } catch (err) {
        console.warn('Remote upload unavailable (CORS/File Origin), fallbacks to Local Data Stream:', err);
      }

      // Jei CORS arba tinklas užblokuoja išorinius serverius, naudojame tiesioginį Data Stream
      if (!uploadedUrl) {
        uploadedUrl = previewDataUrl;
      }

      const caption = document.getElementById('upload-caption').value.trim();
      const fullContent = `${caption} ${uploadedUrl}`.trim();

      // Sukuriame Nostr Event (Kind 1)
      const event = {
        kind: 1,
        pubkey: userKeys.pub,
        created_at: Math.floor(Date.now() / 1000),
        tags: [["t", "hypefeed"]],
        content: fullContent
      };

      // Pasirašymas
      try {
        if (window.NostrTools && typeof NostrTools.finishEvent === 'function') {
          NostrTools.finishEvent(event, userKeys.pk);
        } else if (window.NostrTools && typeof NostrTools.getEventHash === 'function') {
          event.id = NostrTools.getEventHash(event);
          event.sig = NostrTools.signEvent(event, userKeys.pk);
        }
      } catch(e) {
        event.id = 'loc-' + Date.now();
      }

      // Išsiunčiame į P2P tinklą
      const message = JSON.stringify(["EVENT", event]);
      openSockets.forEach(ws => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(message);
        }
      });

      // Momentinis atvaizdavimas viršuje
      createCardDOM('local-' + Date.now(), userKeys.pub, uploadedUrl, caption, true);

      // Uždarome modalą
      closeUploadModal();
      document.getElementById('upload-caption').value = '';

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i> <span>Ištransliuoti į P2P tinklą</span>`;
      if (window.lucide) lucide.createIcons();
    }

    function handleTip(postId, amount) {
      const numericAmount = parseFloat(amount);
      let userBalance = parseFloat(localStorage.getItem('user_wallet_balance') || '5.00');

      if (userBalance < numericAmount) {
        alert('Nepakanka lėšų!');
        return;
      }

      userBalance -= numericAmount;
      localStorage.setItem('user_wallet_balance', userBalance.toFixed(2));
      document.getElementById('balance-display').innerText = `${userBalance.toFixed(2)} €`;

      let postTips = parseFloat(localStorage.getItem(`post_tips_${postId}`) || '0.00');
      postTips += numericAmount;
      localStorage.setItem(`post_tips_${postId}`, postTips.toFixed(2));

      const postTipEl = document.getElementById(`tip-count-${postId}`);
      if (postTipEl) postTipEl.innerText = `${postTips.toFixed(2)} €`;

      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
    }

    function sharePost(id) { alert('Nuoroda nukopijuota!'); }
    function toggleWalletModal() { alert('Piniginės balansas & Nostr raktai.'); }

    // Startas
    window.addEventListener('DOMContentLoaded', () => {
      initIdentity();
      connectNostrRelays();

      const savedBal = localStorage.getItem('user_wallet_balance') || '5.00';
      document.getElementById('balance-display').innerText = `${parseFloat(savedBal).toFixed(2)} €`;
    });
  </script>
</body>
</html>
