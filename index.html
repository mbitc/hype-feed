<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HYPE FEED — P2P Visuals</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Nostr Tools & Dexie (IndexedDB wrapper) -->
  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <style>
    /* Custom Snap Scroll */
    .snap-container {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
    }
    .snap-card {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    /* Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-black text-white font-sans overflow-hidden select-none">

  <!-- TOP BAR (Floating Header) -->
  <header class="fixed top-0 left-0 right-0 z-50 p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent backdrop-blur-sm">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></div>
      <span class="font-extrabold tracking-wider text-sm bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-yellow-400">
        HYPE // LIVE
      </span>
    </div>
    
    <!-- User Balance & Identity Status -->
    <div class="flex items-center gap-3 bg-white/10 px-3 py-1.5 rounded-full border border-white/10 backdrop-blur-md">
      <i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400"></i>
      <span id="balance-display" class="text-xs font-bold font-mono">0.00 €</span>
      <div id="pubkey-preview" class="text-[10px] text-gray-400 font-mono border-l border-white/20 pl-2">...</div>
    </div>
  </header>

  <!-- MAIN SNAP-SCROLL FEED -->
  <main id="feed-container" class="h-screen w-screen overflow-y-scroll snap-container no-scrollbar">
    
    <!-- SAMPLE CARD 1 -->
    <section class="snap-card h-screen w-screen relative flex items-center justify-center bg-zinc-900">
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1000&q=80" 
           alt="Visual Content" class="w-full h-full object-cover" />
      
      <!-- Overlay Gradient -->
      <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 pointer-events-none"></div>

      <!-- Action Buttons (Right Thumb Zone) -->
      <div class="absolute right-4 bottom-28 flex flex-col gap-6 items-center z-20">
        <!-- 🔥 TIP BUTTON -->
        <button onclick="handleTip('post_1', '0.10')" class="group relative flex flex-col items-center">
          <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-600 to-yellow-500 p-0.5 shadow-lg shadow-orange-500/30 active:scale-95 transition">
            <div class="w-full h-full bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm group-hover:bg-transparent">
              <i data-lucide="flame" class="w-7 h-7 text-orange-400 fill-orange-400 group-hover:scale-110 transition"></i>
            </div>
          </div>
          <span class="text-[11px] font-bold mt-1 text-orange-400 font-mono">+0.10 €</span>
        </button>

        <!-- Share Button -->
        <button onclick="sharePost('post_1')" class="flex flex-col items-center group">
          <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center active:scale-95 transition">
            <i data-lucide="share-2" class="w-5 h-5 text-gray-300"></i>
          </div>
          <span class="text-[10px] text-gray-400 mt-1">Dalintis</span>
        </button>
      </div>

      <!-- Post Meta Info (Bottom Left) -->
      <div class="absolute left-4 bottom-24 right-20 z-20">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-bold bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-md border border-orange-500/30">
            @anon_node
          </span>
          <span class="text-[10px] text-gray-400">Prieš 2 min.</span>
        </div>
        <p class="text-sm text-gray-200 line-clamp-2 drop-shadow">
          Kai supranti, kad visas P2P tinklas retai kada klausia serverio leidimo... 🔥🚀
        </p>
      </div>
    </section>

    <!-- SAMPLE CARD 2 -->
    <section class="snap-card h-screen w-screen relative flex items-center justify-center bg-zinc-900">
      <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1000&q=80" 
           alt="Visual Content" class="w-full h-full object-cover" />
      
      <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 pointer-events-none"></div>

      <div class="absolute right-4 bottom-28 flex flex-col gap-6 items-center z-20">
        <button onclick="handleTip('post_2', '0.10')" class="group relative flex flex-col items-center">
          <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-600 to-yellow-500 p-0.5 shadow-lg shadow-orange-500/30 active:scale-95 transition">
            <div class="w-full h-full bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
              <i data-lucide="flame" class="w-7 h-7 text-orange-400 fill-orange-400"></i>
            </div>
          </div>
          <span class="text-[11px] font-bold mt-1 text-orange-400 font-mono">+0.10 €</span>
        </button>
      </div>

      <div class="absolute left-4 bottom-24 right-20 z-20">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-bold bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-md border border-orange-500/30">
            @cyber_mesh
          </span>
        </div>
        <p class="text-sm text-gray-200 line-clamp-2 drop-shadow">Generatyvus menas tinkle be tarpininkų.</p>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-16 bg-black/90 border-t border-white/10 backdrop-blur-lg flex justify-around items-center z-50 px-6">
    <button class="flex flex-col items-center text-orange-500">
      <i data-lucide="compass" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">Srautas</span>
    </button>
    
    <!-- UPLOAD BUTTON (Center Action) -->
    <button onclick="triggerUpload()" class="relative -top-4 w-14 h-14 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-400 p-0.5 shadow-lg shadow-orange-500/40 active:scale-90 transition">
      <div class="w-full h-full bg-black rounded-full flex items-center justify-center">
        <i data-lucide="plus" class="w-7 h-7 text-orange-400"></i>
      </div>
    </button>

    <button onclick="toggleWalletModal()" class="flex flex-col items-center text-gray-400 hover:text-white transition">
      <i data-lucide="wallet" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium mt-1">Piniginė</span>
    </button>
  </nav>

  <!-- HIDDEN FILE INPUT FOR UPLOAD -->
  <input type="file" id="file-input" accept="image/*" class="hidden" onchange="uploadImage(event)" />

  <!-- LOGIC SCRIPT -->
  <script>
    lucide.createIcons();

    // 1. Nostr Relays (Atviri P2P tinklo mazgai)
    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.nostr.band'
    ];

    let postsMap = new Map();
    let userKeys = { pk: '', pub: '' };

    // 2. Automatinis raktų sugeneravimas (Zero Onboarding)
    function initIdentity() {
      let savedPk = localStorage.getItem('hype_priv_key');
      if (!savedPk) {
        if (window.NostrTools) {
          savedPk = NostrTools.generatePrivateKey();
        } else {
          savedPk = 'demo_key_' + Math.random().toString(36).substring(2);
        }
        localStorage.setItem('hype_priv_key', savedPk);
      }
      userKeys.pk = savedPk;
      
      try {
        userKeys.pub = NostrTools.getPublicKey(savedPk);
      } catch (e) {
        userKeys.pub = savedPk.substring(0, 8);
      }
      
      document.getElementById('pubkey-preview').innerText = userKeys.pub.substring(0, 6) + '...';
    }

    // 3. Gyvas P2P ryšys su Nostr relėjais
    function connectToRelays() {
      RELAYS.forEach(url => {
        try {
          const ws = new WebSocket(url);

          ws.onopen = () => {
            // Prašome naujausių tekstų/media įrašų (Kind 1)
            const subRequest = JSON.stringify([
              "REQ", 
              "hype_feed_sub", 
              { kinds: [1], limit: 15 }
            ]);
            ws.send(subRequest);
          };

          ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data[0] === "EVENT" && data[2]) {
              handleIncomingEvent(data[2]);
            }
          };
        } catch (e) {
          console.warn(`Klaida jungiantis prie ${url}`, e);
        }
      });
    }

    // 4. Įeinančių įrašų filtracija (tik nuotraukos)
    function handleIncomingEvent(event) {
      if (postsMap.has(event.id)) return;
      postsMap.set(event.id, event);

      // Ištraukiame nuotraukos URL iš teksto
      const imageUrlMatch = event.content.match(/(https?:\/\/.*\.(?:png|jpg|jpeg|gif|webp))/i);
      if (!imageUrlMatch) return; // Jei nėra vaizdo — praleidžiame

      const imageUrl = imageUrlMatch[0];
      const cleanText = event.content.replace(imageUrl, '').trim();

      renderCard(event.id, event.pubkey, imageUrl, cleanText);
    }

    // 5. Dinaminis kortelės įkėlimas į HTML
    function renderCard(id, pubkey, mediaUrl, text) {
      const container = document.getElementById('feed-container');
      const shortPubkey = pubkey.substring(0, 8);
      
      const cardHtml = `
        <section class="snap-card h-screen w-screen relative flex items-center justify-center bg-zinc-900" id="${id}">
          <img src="${mediaUrl}" alt="Visual Content" class="w-full h-full object-cover" loading="lazy" />
          <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 pointer-events-none"></div>

          <div class="absolute right-4 bottom-28 flex flex-col gap-6 items-center z-20">
            <button onclick="handleTip('${id}', '0.10')" class="group relative flex flex-col items-center">
              <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-600 to-yellow-500 p-0.5 shadow-lg shadow-orange-500/30 active:scale-95 transition">
                <div class="w-full h-full bg-black/40 rounded-full flex items-center justify-center backdrop-blur-sm">
                  <i data-lucide="flame" class="w-7 h-7 text-orange-400 fill-orange-400"></i>
                </div>
              </div>
              <span class="text-[11px] font-bold mt-1 text-orange-400 font-mono">+0.10 €</span>
            </button>

            <button onclick="sharePost('${id}')" class="flex flex-col items-center group">
              <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center active:scale-95 transition">
                <i data-lucide="share-2" class="w-5 h-5 text-gray-300"></i>
              </div>
              <span class="text-[10px] text-gray-400 mt-1">Dalintis</span>
            </button>
          </div>

          <div class="absolute left-4 bottom-24 right-20 z-20">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-md border border-orange-500/30">
                @${shortPubkey}
              </span>
            </div>
            <p class="text-sm text-gray-200 line-clamp-2 drop-shadow">${text || 'Visual Drop'}</p>
          </div>
        </section>
      `;

      container.insertAdjacentHTML('beforeend', cardHtml);
      if (window.lucide) lucide.createIcons();
    }

    // 6. Tip Handling
    async function handleTip(postId, amount) {
      if (navigator.vibrate) navigator.vibrate(50);

      let currentBalance = parseFloat(localStorage.getItem('demo_balance') || '0.20');
      currentBalance += parseFloat(amount);
      localStorage.setItem('demo_balance', currentBalance.toFixed(2));
      document.getElementById('balance-display').innerText = `${currentBalance.toFixed(2)} €`;
    }

    function sharePost(postId) {
      navigator.clipboard.writeText(window.location.href);
      alert('Nuoroda nukopijuota!');
    }

    function triggerUpload() {
      document.getElementById('file-input').click();
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      initIdentity();
      connectToRelays();
      const savedBal = localStorage.getItem('demo_balance') || '0.20';
      document.getElementById('balance-display').innerText = `${savedBal} €`;
    });
  </script>
</body>
</html>
