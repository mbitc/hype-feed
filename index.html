<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <!-- Fullscreen / Mobile App viewport setup -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hype Feed // Pure P2P Stream</title>

  <!-- PWA & Mobile Web App Meta Tags (Paslepia naršyklės barą) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HypeFeed" />
  <meta name="theme-color" content="#09090b" />

  <!-- Dynamic Web App Manifest Data-URL -->
  <script>
    (function() {
      const manifest = {
        name: "Hype Feed",
        short_name: "HypeFeed",
        start_url: "./",
        display: "standalone",
        background_color: "#09090b",
        theme_color: "#09090b",
        orientation: "portrait"
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], {type: 'application/json'});
      const manifestURL = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);
    })();
  </script>

  <!-- CDN Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #09090b;
      color: #ffffff;
      /* iPhone Notch ir gesture bar palaikymas */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .feed-viewport {
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
      overflow-anchor: none;
    }

    .feed-card {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      width: 100%;
      flex-shrink: 0;
      contain: strict;
    }

    .img-loader {
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="select-none font-sans bg-zinc-950 text-white">

      <span id="feed-mode-tag" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/10 text-zinc-400">GLOBAL</span>

    <div class="flex items-center gap-2.5 pointer-events-auto">
      <button onclick="openWalletModal()" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/50 backdrop-blur-md border border-white/10 active:scale-95 transition">

  <!-- MEDIA SOURCE PICKER MODAL (CAMERA OR GALLERY) -->

  <!-- UPLOAD PREVIEW MODAL -->

      <h2 class="text-base font-bold text-orange-400">Support Creator ⚡ Zap</h2>
      <button onclick="closeZapSheet()" class="text-zinc-400 hover:text-white p-2">
        <i data-lucide="x" class="w-6 h-6"></i>

        </div>
        <div id="lud16-status" class="text-[11px] text-emerald-400 mt-1 h-4 font-mono"></div>
      </div>
      <button onclick="resetIdentity()" class="text-xs text-red-400 underline mt-4 text-left">Generate new identity keypair</button>
    </div>
  </div>

  <!-- FLOATING ACTION BUTTON -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30">
    <button onclick="openSourcePicker()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-400 p-0.5 shadow-xl shadow-orange-500/20 active:scale-90 transition">
      <div class="w-full h-full bg-zinc-950 rounded-full flex items-center justify-center">
        <i data-lucide="plus" class="w-7 h-7 text-orange-400"></i>
      </div>
    </button>
  </div>

  <script>
    const RELAYS = [
      'wss://nos.lol',
      'wss://relay.nostr.band',
      'wss://purplerelay.com',
      'wss://relay.damus.io'
    ];
    const GEOHASH_PRECISION = 5;
    const MAX_DOM_CARDS = 40;

    let userKeys = { pk: '', pub: '' };
    let usingExtension = false;
    let userGeohash = null;
    let loadedPostIds = new Set();
    let cardOrderArray = [];
    let selectedFile = null;
    let previewDataUrl = '';
    let openSockets = [];
    let pendingResolvers = {};
    let profileCache = new Map();
    let processedZapReceipts = new Set();
    let totalReceivedSats = 0;
    let currentZapTarget = null;
    let selectedZapAmount = 100;
    let postTips = new Map();
    let processedTipReceipts = new Set();
    let pendingZapReqId = null;
    let tipTimer = null;
    let lastProfileMsg = null;
    let linkTarget = ((location.hash.match(/^#(nostr-[0-9a-f]{64})$/i) || [])[1] || '').toLowerCase() || null;
    // Link opened while the feed is already open (hash-only navigation does not reload the page)
    // Hold the linked card in view while the feed settles (late cards, removed broken images, dvh changes)
    let linkUserMoved = false, linkTimer = null;
    ['touchstart', 'wheel', 'keydown', 'mousedown'].forEach(t => window.addEventListener(t, () => { linkUserMoved = true; }, { passive: true }));
    function focusLinked() {
      linkUserMoved = false;
      clearInterval(linkTimer);
      const c = document.getElementById('feed-container');
      let n = 0;
      const place = () => {
        const el = linkTarget && document.getElementById(linkTarget);
        if (!el) return;
        c.scrollTop = el.getBoundingClientRect().top - c.getBoundingClientRect().top + c.scrollTop;
      };
      place();
      linkTimer = setInterval(() => { if (linkUserMoved || ++n > 16) return clearInterval(linkTimer); place(); }, 250);
    }
    function gotoLink() {
      const m = (location.hash.match(/^#(nostr-[0-9a-f]{64})$/i) || [])[1];
      if (!m) return;
      linkTarget = m.toLowerCase();
      const el = document.getElementById(linkTarget);
      if (el) return focusLinked();
      openSockets.forEach(ws => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(['REQ', 'link_post', { ids: [linkTarget.slice(6)] }])); });
    }
    window.addEventListener('hashchange', gotoLink);
    let pendingZap = null, verifyTimer = null, lastVerifyUrl = null;
    let lastZapSupport = false;
    const localTips = new Map();
    try { Object.entries(JSON.parse(localStorage.getItem('hype_local_tips') || '{}')).forEach(([k, v]) => localTips.set(k, v)); } catch (e) {}
    function renderTip(eid) {
      const total = Math.max(postTips.get(eid) || 0, localTips.get(eid) || 0);
      const el = document.getElementById(`tip-count-nostr-${eid}`);
      if (el) { el.dataset.sats = total; el.innerText = `${total} ⚡`; }
    }
    function onZapPaid() {
      if (!pendingZap) return;
      const z = pendingZap; pendingZap = null; pendingZapReqId = null;
      clearInterval(verifyTimer);
      if (z.eventId) { localTips.set(z.eventId, (localTips.get(z.eventId) || 0) + z.amount); renderTip(z.eventId);
        try { localStorage.setItem('hype_local_tips', JSON.stringify(Object.fromEntries(localTips))); } catch (e) {} }
      closeZapSheet(); toast('Zap sent ⚡');
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
    }
    function startVerifyPoll(url) {
      clearInterval(verifyTimer);
      if (!url) return;
      let n = 0;
      verifyTimer = setInterval(async () => {
        if (++n > 100) return clearInterval(verifyTimer);
        try { const j = await (await fetch(url)).json(); if (j && j.settled) onZapPaid(); } catch (e) {}
      }, 3000);
    }
    function esc(v) { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function hexToBytes(hex) {
      let bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return bytes;
    }

    // GEOHASH
    const GEOHASH_BASE32 = '0123456789bcdefghjkmnpqrstuvwxyz';
    function encodeGeohash(lat, lon, precision) {
      let latRange = [-90, 90], lonRange = [-180, 180];
      let geohash = '', isEven = true, bit = 0, ch = 0;
      while (geohash.length < precision) {
        if (isEven) {
          const mid = (lonRange[0] + lonRange[1]) / 2;
          if (lon > mid) { ch |= (1 << (4 - bit)); lonRange[0] = mid; } else { lonRange[1] = mid; }
        } else {
          const mid = (latRange[0] + latRange[1]) / 2;
          if (lat > mid) { ch |= (1 << (4 - bit)); latRange[0] = mid; } else { latRange[1] = mid; }
        }
        isEven = !isEven;
        if (bit < 4) { bit++; } else { geohash += GEOHASH_BASE32[ch]; bit = 0; ch = 0; }
      }
      return geohash;
    }

    function tryGetAutoLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        const timer = setTimeout(() => resolve(null), 2500);
        navigator.geolocation.getCurrentPosition(
          (pos) => { clearTimeout(timer); resolve(encodeGeohash(pos.coords.latitude, pos.coords.longitude, GEOHASH_PRECISION)); },
          () => { clearTimeout(timer); resolve(null); },
          { enableHighAccuracy: false, timeout: 2300, maximumAge: 600000 }
        );
      });
    }

    // IDENTITY MANAGEMENT
    function randomHex32() {
      return Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function initIdentity() {
      if (window.nostr && typeof window.nostr.getPublicKey === 'function') {
        try {
          userKeys.pub = await window.nostr.getPublicKey();
          usingExtension = true;
        } catch (e) { usingExtension = false; }
      }
      if (!usingExtension) {
        let savedPk = localStorage.getItem('hype_priv_key');
        if (!savedPk) {
          savedPk = (window.NostrTools && NostrTools.generatePrivateKey) ? NostrTools.generatePrivateKey() : randomHex32();
          localStorage.setItem('hype_priv_key', savedPk);
        }
        userKeys.pk = savedPk;
        try {
          const bytes = hexToBytes(savedPk);
          userKeys.pub = (window.NostrTools && NostrTools.getPublicKey) ? NostrTools.getPublicKey(bytes) : savedPk.substring(0, 8);
        } catch (e) { 
          userKeys.pub = savedPk.substring(0, 8); 
        }
      }
      const pubEl = document.getElementById('pubkey-preview');
      if (pubEl) pubEl.innerText = (userKeys.pub || '').substring(0, 6) + '...';
    }

    async function signEventCompat(event) {
      event.pubkey = userKeys.pub;
      if (usingExtension && window.nostr) {
        try { return await window.nostr.signEvent(event); }
        catch (e) { console.warn('Extension sign failed, falling back to local key', e); }
      }
      try {
        const pkBytes = hexToBytes(userKeys.pk);
        if (window.NostrTools && NostrTools.finishEvent) {
          return NostrTools.finishEvent(event, pkBytes);
        } else if (window.NostrTools && NostrTools.getEventHash) {
          event.id = NostrTools.getEventHash(event);
          event.sig = NostrTools.signEvent(event, pkBytes);
          return event;
        }
      } catch (e) { console.error('Sign error:', e); }
      event.id = 'loc-' + Date.now();
      return event;
    }

    function getNpub() {
      try {
        if (window.NostrTools && NostrTools.nip19 && NostrTools.nip19.npubEncode) {
          return NostrTools.nip19.npubEncode(userKeys.pub);
        }
      } catch (e) {}
      return userKeys.pub;
    }

    function resetIdentity() {
      if (!confirm('Are you sure you want to reset your identity keys?')) return;
      localStorage.removeItem('hype_priv_key');
      localStorage.removeItem('hype_lud16');
      location.reload();
    }

    // RELAYS
    function openRelayConnections() {
      RELAYS.forEach(url => connectRelay(url, 0));
    }

    function connectRelay(url, attempt) {
      let ws;
      try { ws = new WebSocket(url); } catch (e) { return scheduleReconnect(url, attempt); }

      ws.onopen = () => {
        openSockets.push(ws);
        subscribeFeed(ws);
        subscribeZapReceipts(ws);
        sendTipSub(ws);
        flushPendingProfileRequests(ws);
        if (lastProfileMsg) ws.send(lastProfileMsg);
        if (linkTarget && !loadedPostIds.has(linkTarget)) ws.send(JSON.stringify(['REQ', 'link_post', { ids: [linkTarget.slice(6)] }]));
      };
      ws.onmessage = (msg) => routeMessage(msg);
      ws.onclose = () => {
        openSockets = openSockets.filter(s => s !== ws);
        scheduleReconnect(url, attempt);
      };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    }

    function scheduleReconnect(url, attempt) {
      const delay = Math.min(30000, 1000 * Math.pow(2, attempt));
      setTimeout(() => connectRelay(url, attempt + 1), delay);
    }

    function subscribeFeed(ws) {
      const filters = [
        { kinds: [1], '#t': ['hypefeed'], limit: 40 },
        { kinds: [1], limit: 40 }
      ];
      if (userGeohash) {
        filters.unshift({ kinds: [1], '#g': [userGeohash], limit: 30 });
        document.getElementById('feed-mode-tag').innerText = 'LOCAL + GLOBAL';
      }
      ws.send(JSON.stringify(['REQ', 'live_feed', ...filters]));
    }

    function subscribeZapReceipts(ws) {
      if (!userKeys.pub) return;
      ws.send(JSON.stringify(['REQ', 'zap_receipts', { kinds: [9735], '#p': [userKeys.pub], limit: 500 }]));
    }

    // Tip counts for every visible post (zaps from anyone, matched by e-tag)
    function sendTipSub(ws) {
      const ids = cardOrderArray.filter(i => /^nostr-[0-9a-f]{64}$/i.test(i)).map(i => i.slice(6));
      if (ids.length && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(['REQ', 'zap_tips', { kinds: [9735], '#e': ids }]));
    }
    function queueTipSub() {
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => openSockets.forEach(sendTipSub), 800);
    }

    function flushPendingProfileRequests(ws) {
      Object.keys(pendingResolvers).forEach(subId => {
        const req = pendingResolvers[subId];
        if (req && req.filter) ws.send(JSON.stringify(['REQ', subId, req.filter]));
      });
    }

    function routeMessage(msg) {
      let res;
      try { res = JSON.parse(msg.data); } catch (e) { return; }
      if (res[0] !== 'EVENT') return;
      const subId = res[1];
      const ev = res[2];
      if (!ev) return;

      if (subId === 'live_feed' || subId === 'link_post') {
        handleFeedEvent(ev);
      } else if (subId === 'zap_receipts') {
        handleZapReceipt(ev, 'balance');
      } else if (subId === 'zap_tips') {
        handleZapReceipt(ev, 'tips');
      } else if (pendingResolvers[subId]) {
        const b = pendingResolvers[subId];
        b.events.push(ev);
        if (!b.soon && b.finish) b.soon = setTimeout(b.finish, 800);
      }
    }

    // FEED & DOM OPTIMIZATION
    function handleFeedEvent(ev) {
      if (!ev.content) return;
      const imgMatch = ev.content.match(/(https?:\/\/[^\s]+?\.(?:png|jpg|jpeg|gif|webp)(?:\?[^\s]*)?|data:image\/[a-zA-Z]+;base64,[^\s]+)/i);
      if (!imgMatch) return;

      const isLocal = !!(userGeohash && ev.tags.some(tag => tag[0] === 'g' && tag[1] === userGeohash));
      createCardDOM('nostr-' + ev.id, ev.pubkey, imgMatch[0], ev.content.replace(imgMatch[0], '').trim(), ('nostr-' + ev.id) === linkTarget, isLocal);
    }

    function pruneOldCards() {
      if (cardOrderArray.length <= MAX_DOM_CARDS) return;
      const removeCount = cardOrderArray.length - MAX_DOM_CARDS;
      for (let i = 0; i < removeCount; i++) {
        const oldId = cardOrderArray.splice(cardOrderArray[0] === linkTarget ? 1 : 0, 1)[0];
        loadedPostIds.delete(oldId);
        const el = document.getElementById(oldId);
        if (el) el.remove();
      }
    }

    function createCardDOM(id, pubkey, mediaUrl, text, isPrepend, isLocal) {
      if (loadedPostIds.has(id)) return;
      loadedPostIds.add(id);

      const emptyState = document.getElementById('empty-state');
      if (emptyState) emptyState.remove();

      const container = document.getElementById('feed-container');
      const card = document.createElement('section');
      card.className = 'feed-card flex items-center justify-center bg-zinc-950 overflow-hidden';
      card.id = id;

      const shortPubkey = pubkey ? pubkey.substring(0, 8) : 'anon';
      const eid0 = id.startsWith('nostr-') ? id.slice(6) : '';
      const sats0 = Math.max(postTips.get(eid0) || 0, localTips.get(eid0) || 0);

        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80 z-10 pointer-events-none"></div>

        <div class="absolute right-4 bottom-28 flex flex-col gap-6 items-center z-20">
          <button data-id="${esc(id)}" data-pk="${esc(pubkey)}" onclick="openZapSheet(this.dataset.id, this.dataset.pk)" class="group relative flex flex-col items-center">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-orange-600 to-yellow-500 p-0.5 shadow-lg shadow-orange-500/30 active:scale-95 transition">

    // IMAGE PROCESSING & UPLOAD
    function compressImage(file, maxDimension = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width, height = img.height;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;
      previewDataUrl = await compressImage(file);

    async function publishPost() {
      if (!selectedFile) return;
      const btn = document.getElementById('publish-btn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span>Broadcasting...</span>`;
      if (window.lucide) lucide.createIcons();

      let uploadedUrl = '';
      try {
        const fetchRes = await fetch(previewDataUrl);
        const blob = await fetchRes.blob();
        const formData = new FormData();
        formData.append('file[]', blob, 'upload.jpg');

        const response = await fetch('https://nostr.build/api/v2/upload/files', { method: 'POST', body: formData });
        if (response.ok) {
          const data = await response.json();
          if (data && data.data && data.data[0] && data.data[0].url) uploadedUrl = data.data[0].url;
        }
      } catch (err) {
        console.warn('Remote upload unreachable, falling back to data URL payload:', err);
      }
      if (!uploadedUrl) uploadedUrl = previewDataUrl;

      const caption = document.getElementById('upload-caption').value.trim();
      const fullContent = `${caption} ${uploadedUrl}`.trim();

      const tags = [['t', 'hypefeed']];
      if (userGeohash) tags.push(['g', userGeohash]);

      let event = {
        kind: 1,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content: fullContent
      };
      event = await signEventCompat(event);

      const message = JSON.stringify(['EVENT', event]);
      openSockets.forEach(ws => { if (ws.readyState === WebSocket.OPEN) ws.send(message); });

      createCardDOM('nostr-' + (event.id && !String(event.id).startsWith('loc-') ? event.id : 'local' + Date.now()), userKeys.pub, uploadedUrl, caption, true, !!userGeohash);

      closeUploadModal();
      document.getElementById('upload-caption').value = '';
      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i> <span>Broadcast Stream</span>`;
      if (window.lucide) lucide.createIcons();
    }

    function sharePost(id) {

    // PROFILE & ZAPS LOGIC
    function fetchMetadata(pubkey, force) {
      if (!force && profileCache.has(pubkey)) return Promise.resolve(profileCache.get(pubkey));
      return new Promise((resolve) => {
        const subId = 'prof_' + pubkey.substring(0, 8) + '_' + Date.now();
        const filter = { kinds: [0], authors: [pubkey], limit: 1 };
        const bucket = pendingResolvers[subId] = { events: [], filter, soon: null };
        openSockets.forEach(ws => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(['REQ', subId, filter])); });
        let maxT;
        const finish = () => {
          clearTimeout(bucket.soon); clearTimeout(maxT);
          delete pendingResolvers[subId];
          openSockets.forEach(ws => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(['CLOSE', subId])); });
          let meta = null;
          if (bucket.events.length) {
            bucket.events.sort((a, b) => b.created_at - a.created_at);
            try { meta = JSON.parse(bucket.events[0].content) || null; } catch (e) {}
          }
          if (meta) profileCache.set(pubkey, meta); else profileCache.delete(pubkey); // never cache a miss
          resolve(meta);
        };
        bucket.finish = finish;
        maxT = setTimeout(finish, 5000);
      });
    }
    async function fetchProfile(pubkey) {
      const m = await fetchMetadata(pubkey);
      return (m && m.lud16) || null;
    }

    async function publishProfileMetadata(lud16) {
      const base = (await fetchMetadata(userKeys.pub, true)) || {}; // keep name/picture etc.
      const meta = { ...base, lud16 };
      let event = { kind: 0, created_at: Math.floor(Date.now() / 1000), tags: [], content: JSON.stringify(meta) };
      event = await signEventCompat(event);
      lastProfileMsg = JSON.stringify(['EVENT', event]);
      openSockets.forEach(ws => { if (ws.readyState === WebSocket.OPEN) ws.send(lastProfileMsg); });
      profileCache.set(userKeys.pub, meta);
    }

    async function buildZapRequest(recipientPubkey, amountSats, comment, eventId) {
      const tags = [
        ['relays', ...RELAYS],
        ['amount', String(amountSats * 1000)],
        ['p', recipientPubkey]
      ];
      if (eventId) tags.push(['e', eventId]);
      let event = {
        kind: 9734,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content: comment || ''
      };
      return await signEventCompat(event);
    }

    function invoiceMsats(inv) {
      const m = /^ln(?:bcrt|bc|tbs|tb)(\d+)([munp])?1/i.exec(inv || '');
      if (!m) return null;
      const mult = { m: 1e8, u: 1e5, n: 1e2, p: 0.1 }[(m[2] || '').toLowerCase()] ?? 1e11;
      return Math.round(parseInt(m[1], 10) * mult);
    }

    function toBech32Lnurl(url) {
      const CH = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l', G = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
      const polymod = v => { let c = 1; for (const x of v) { const b = c >>> 25; c = ((c & 0x1ffffff) << 5) ^ x; for (let i = 0; i < 5; i++) if ((b >> i) & 1) c ^= G[i]; } return c; };
      const hrp = 'lnurl', data = [];
      let acc = 0, bits = 0;
      for (const b of new TextEncoder().encode(url)) { acc = (acc << 8) | b; bits += 8; while (bits >= 5) { bits -= 5; data.push((acc >> bits) & 31); } acc &= (1 << bits) - 1; }
      if (bits) data.push((acc << (5 - bits)) & 31);
      const hrpExp = [...hrp].map(c => c.charCodeAt(0) >> 5).concat(0, [...hrp].map(c => c.charCodeAt(0) & 31));
      const mod = polymod(hrpExp.concat(data, [0, 0, 0, 0, 0, 0])) ^ 1;
      const chk = [0, 1, 2, 3, 4, 5].map(i => (mod >> (5 * (5 - i))) & 31);
      return hrp + '1' + data.concat(chk).map(i => CH[i]).join('');
    }

    async function requestInvoice(lud16, amountSats, zapRequestEvent) {
      const m = /^([a-z0-9._+-]+)@([a-z0-9.-]+\.[a-z]{2,})$/i.exec((lud16 || '').trim());
      if (!m) throw new Error('Invalid Lightning address');
      const lnurlEndpoint = `https://${m[2]}/.well-known/lnurlp/${m[1]}`;
      let lnurlData;
      try { lnurlData = await (await fetch(lnurlEndpoint)).json(); }
      catch (e) { throw new Error('Recipient wallet server unreachable'); }
      if (lnurlData.status === 'ERROR') throw new Error(lnurlData.reason || 'Wallet server error');
      if (!lnurlData.callback) throw new Error('LNURL callback missing');

      const amountMsat = amountSats * 1000;
      if (lnurlData.minSendable && amountMsat < lnurlData.minSendable) throw new Error(`Minimum is ${Math.ceil(lnurlData.minSendable / 1000)} sats`);
      if (lnurlData.maxSendable && amountMsat > lnurlData.maxSendable) throw new Error(`Maximum is ${Math.floor(lnurlData.maxSendable / 1000)} sats`);

      const params = new URLSearchParams({ amount: String(amountMsat) });
      if (lnurlData.allowsNostr && lnurlData.nostrPubkey && zapRequestEvent && zapRequestEvent.sig) {
        params.set('nostr', JSON.stringify(zapRequestEvent));
        params.set('lnurl', toBech32Lnurl(lnurlEndpoint));
      }
      lastZapSupport = params.has('nostr');
      const sep = lnurlData.callback.includes('?') ? '&' : '?';
      let invoiceData;
      try { invoiceData = await (await fetch(`${lnurlData.callback}${sep}${params.toString()}`)).json(); }
      catch (e) { throw new Error('Could not fetch invoice'); }
      if (invoiceData.status === 'ERROR') throw new Error(invoiceData.reason || 'Wallet server error');
      if (!invoiceData.pr) throw new Error('Failed to generate Lightning invoice');
      lastVerifyUrl = invoiceData.verify || null;
      const got = invoiceMsats(invoiceData.pr);
      if (got !== null && got !== amountMsat) throw new Error('Invoice amount mismatch - payment blocked');
      return invoiceData.pr;
    }

    function handleZapReceipt(ev, source) {
      const seen = source === 'tips' ? processedTipReceipts : processedZapReceipts;
      if (seen.has(ev.id)) return;
      seen.add(ev.id);
      try {
        if (ev.kind !== 9735) return;
        if (window.NostrTools && NostrTools.verifySignature && !NostrTools.verifySignature(ev)) return;
        const descTag = ev.tags.find(t => t[0] === 'description');
        if (!descTag) return;
        const zapReq = JSON.parse(descTag[1]);
        const reqMsat = parseInt(((zapReq.tags || []).find(t => t[0] === 'amount') || [])[1], 10);
        const billTag = ev.tags.find(t => t[0] === 'bolt11');
        const billMsat = billTag ? invoiceMsats(billTag[1]) : null;
        if (billMsat && reqMsat && billMsat !== reqMsat) return; // forged / mismatching receipt
        const sats = Math.round((billMsat || reqMsat) / 1000);
        if (!sats) return;

        if (zapReq.id && pendingZap && zapReq.id === pendingZap.reqId) onZapPaid();
        if (source === 'balance') {
          const pTag = ev.tags.find(t => t[0] === 'p');
          if (!pTag || pTag[1] !== userKeys.pub) return;
          totalReceivedSats += sats;
          updateBalanceDisplay();
        } else {
          const eTag = ev.tags.find(t => t[0] === 'e');
          if (!eTag) return;
          postTips.set(eTag[1], (postTips.get(eTag[1]) || 0) + sats);
          renderTip(eTag[1]);
        }
      } catch (e) { console.warn('Zap receipt parse error', e); }
    }

    function updateBalanceDisplay() {
      document.getElementById('balance-display').innerText = `${totalReceivedSats} ⚡`;
    }

    async function openZapSheet(postId, authorPubkey) {
      currentZapTarget = { postId, authorPubkey };
      const body = document.getElementById('zap-body');
      body.innerHTML = `<p class="text-zinc-400 text-sm">Resolving recipient Lightning address...</p>`;
      showModal('zap-modal');

      const lud16 = await fetchProfile(authorPubkey);
      if (!lud16) {
        body.innerHTML = `<p class="text-zinc-400 text-sm">Author hasn't added a Lightning address yet.</p>`;
        return;
      }
      currentZapTarget.lud16 = lud16;
      renderZapAmountPicker();
    }

    function closeZapSheet() { clearInterval(verifyTimer); hideModal('zap-modal'); }

    function renderZapAmountPicker() {
      const body = document.getElementById('zap-body');
      const amounts = [21, 100, 500, 1000];
      body.innerHTML = `
        <div class="grid grid-cols-4 gap-2 w-full">
          ${amounts.map(a => `<button onclick="selectZapAmount(${a})" class="zap-amount-btn py-3 rounded-lg bg-zinc-900 border border-white/10 text-sm font-bold text-yellow-300 active:scale-95 transition">${a}</button>`).join('')}
        </div>
        <input id="zap-custom-amount" type="number" min="1" placeholder="Custom sats..." class="w-full px-4 py-3 rounded-lg bg-zinc-900 border border-white/10 text-sm text-white mt-2 focus:outline-none focus:border-orange-500 font-sans" />
        <button onclick="confirmZap()" class="w-full py-3.5 rounded-full bg-gradient-to-r from-orange-500 to-yellow-400 font-bold text-black mt-2 flex items-center justify-center gap-2 active:scale-95 transition">
          <i data-lucide="zap" class="w-5 h-5"></i><span>Send Zap</span>
        </button>
      `;
      if (window.lucide) lucide.createIcons();
      selectZapAmount(selectedZapAmount);
    }

    function selectZapAmount(a) {
      selectedZapAmount = a;
      const custom = document.getElementById('zap-custom-amount');
      if (custom) custom.value = '';
      document.querySelectorAll('.zap-amount-btn').forEach(b => {
        const on = b.textContent.trim() === String(a);
        b.classList.toggle('border-orange-500', on);
        b.classList.toggle('bg-orange-500/20', on);
      });
    }

    async function confirmZap() {
      const customInput = document.getElementById('zap-custom-amount');
      const customVal = customInput ? parseInt(customInput.value || '', 10) : NaN;
      const amount = customVal > 0 ? customVal : selectedZapAmount;
      const body = document.getElementById('zap-body');
      body.innerHTML = `<p class="text-zinc-400 text-sm">Generating Lightning invoice...</p>`;

      try {
        const eventId = /^nostr-[0-9a-f]{64}$/i.test(currentZapTarget.postId) ? currentZapTarget.postId.slice(6) : null;
        const zapReq = await buildZapRequest(currentZapTarget.authorPubkey, amount, '', eventId);
        pendingZapReqId = zapReq.sig ? zapReq.id : null;
        pendingZap = { amount, eventId, reqId: pendingZapReqId };
        lastVerifyUrl = null;
        const invoice = await requestInvoice(currentZapTarget.lud16, amount, zapReq);
        renderInvoice(invoice);
        startVerifyPoll(lastVerifyUrl);
      } catch (e) {
        console.warn('Zap request error:', e);
        pendingZapReqId = null;
        body.innerHTML = `<p class="text-red-400 text-sm">${esc(e.message || 'Payment request failed')}</p>
          <button onclick="renderZapAmountPicker()" class="text-xs text-orange-400 underline mt-2">Try again</button>`;
      }
    }

    function renderInvoice(invoice) {
      const body = document.getElementById('zap-body');
      const hasWebLN = !!window.webln;
      body.innerHTML = `
        <div class="bg-white p-3 rounded-xl flex items-center justify-center"><div id="zap-qr"></div></div>
        <a href="lightning:${esc(invoice)}" class="w-full py-3.5 rounded-full bg-gradient-to-r from-orange-500 to-yellow-400 font-bold text-black mt-2 text-center active:scale-95 transition">Open in Wallet App</a>
        ${hasWebLN ? `<button id="webln-pay-btn" class="w-full py-3 rounded-full bg-zinc-900 border border-white/10 font-bold text-yellow-300 active:scale-95 transition">Pay with Wallet Extension</button>` : ''}
        <button id="copy-invoice-btn" class="text-xs text-orange-400 underline">Copy Invoice</button>
        <p class="text-xs text-zinc-500">${lastZapSupport ? 'Waiting for payment...' : 'This Lightning address does not issue zap receipts - the post counter will only update on this device.'}</p>
        ${lastVerifyUrl ? '' : '<button id="paid-btn" class="w-full py-3 rounded-full bg-zinc-900 border border-white/10 font-bold text-yellow-300 active:scale-95 transition">I paid</button>'}
      `;
      if (window.QRCode) {
        new QRCode(document.getElementById('zap-qr'), { text: 'LIGHTNING:' + invoice.toUpperCase(), width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L });
      }
      document.getElementById('copy-invoice-btn').onclick = () => {
        (navigator.clipboard ? navigator.clipboard.writeText(invoice) : Promise.reject()).then(() => toast('Invoice copied'), () => toast('Copy failed'));
      };
      const paidBtn = document.getElementById('paid-btn');
      if (paidBtn) paidBtn.onclick = onZapPaid;
      if (hasWebLN) {
        document.getElementById('webln-pay-btn').onclick = () => payWithWebLN(invoice, false);
        payWithWebLN(invoice, true);
      }
    }

    async function payWithWebLN(invoice, silent) {
      if (!window.webln) { if (!silent) toast('No WebLN wallet detected'); return; }
      try {
        await window.webln.enable();
        await window.webln.sendPayment(invoice);
        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
        onZapPaid();
      } catch (e) {
        console.warn('WebLN payment canceled or failed', e);
        if (!silent) toast('Payment cancelled or failed');
      }
    }

    // WALLET MODAL
    async function openWalletModal() {
      document.getElementById('wallet-npub').innerText = getNpub();
      document.getElementById('lud16-input').value = localStorage.getItem('hype_lud16') || '';
      document.getElementById('ext-status').innerText = usingExtension ? 'Connected via Nostr extension (NIP-07)' : 'Using local keypair';
      showModal('wallet-modal');
    }
    function closeWalletModal() { hideModal('wallet-modal'); }

    function saveLud16() {
      const val = document.getElementById('lud16-input').value.trim().toLowerCase();
      const status = document.getElementById('lud16-status');
      const say = (t, ok) => {
        status.classList.toggle('text-emerald-400', ok);
        status.classList.toggle('text-red-400', !ok);
        status.innerText = t;
        setTimeout(() => { status.innerText = ''; }, 3000);
      };
      if (!/^[a-z0-9._+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(val)) return say('Invalid address (name@domain.com)', false);
      localStorage.setItem('hype_lud16', val);
      publishProfileMetadata(val).then(() => say(openSockets.length ? 'Saved & published to Nostr relays' : 'Saved - will publish when relays connect', true));
    }

    // UI HELPERS
    function showModal(id) { const el = document.getElementById(id); el.classList.remove('hidden'); el.classList.add('flex'); }
    function hideModal(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('flex'); }

    function toast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-black/80 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full z-[200] pointer-events-none transition-opacity duration-300 font-mono';
        document.body.appendChild(el);
      }
      el.innerText = msg;
      el.style.opacity = '1';
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.opacity = '0'; }, 2000);
    }

    // BOOTSTRAP
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();

      await initIdentity();
      userGeohash = await tryGetAutoLocation();
      openRelayConnections();

      const ownLud16 = await fetchProfile(userKeys.pub);
      if (ownLud16) {
        localStorage.setItem('hype_lud16', ownLud16);
      }

      updateBalanceDisplay();
    });
  </script>
